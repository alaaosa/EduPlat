services:

  redis-primary:
    image: redis:7
    container_name: redis-primary
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    networks:
      redis-network:
        ipv4_address: 172.21.0.2

  redis-replica:
    image: redis:7
    container_name: redis-replica
    command: redis-server --replicaof 172.21.0.2 6379
    ports:
      - "6380:6379"
    depends_on:
      - redis-primary
    networks:
      redis-network:
        ipv4_address: 172.21.0.3

  sentinel-1:
    image: redis:7
    container_name: sentinel-1
    command: >
      sh -c "
      until redis-cli -h 172.21.0.2 -p 6379 ping; do
        echo 'Waiting for Redis Primary...';
        sleep 1;
      done;
      echo 'sentinel monitor mymaster 172.21.0.2 6379 2' > /tmp/sentinel.conf;
      echo 'sentinel down-after-milliseconds mymaster 5000' >> /tmp/sentinel.conf;
      echo 'sentinel failover-timeout mymaster 10000' >> /tmp/sentinel.conf;
      echo 'sentinel parallel-syncs mymaster 1' >> /tmp/sentinel.conf;
      redis-server /tmp/sentinel.conf --sentinel
      "
    ports:
      - "26379:26379"
    depends_on:
      - redis-primary
      - redis-replica
    networks:
      redis-network:
        ipv4_address: 172.21.0.4

  sentinel-2:
    image: redis:7
    container_name: sentinel-2
    command: >
      sh -c "
      until redis-cli -h 172.21.0.2 -p 6379 ping; do
        echo 'Waiting for Redis Primary...';
        sleep 1;
      done;
      echo 'sentinel monitor mymaster 172.21.0.2 6379 2' > /tmp/sentinel.conf;
      echo 'sentinel down-after-milliseconds mymaster 5000' >> /tmp/sentinel.conf;
      echo 'sentinel failover-timeout mymaster 10000' >> /tmp/sentinel.conf;
      echo 'sentinel parallel-syncs mymaster 1' >> /tmp/sentinel.conf;
      redis-server /tmp/sentinel.conf --sentinel
      "
    ports:
      - "26380:26379"
    depends_on:
      - redis-primary
      - redis-replica
    networks:
      redis-network:
        ipv4_address: 172.21.0.5

  sentinel-3:
    image: redis:7
    container_name: sentinel-3
    command: >
      sh -c "
      until redis-cli -h 172.21.0.2 -p 6379 ping; do
        echo 'Waiting for Redis Primary...';
        sleep 1;
      done;
      echo 'sentinel monitor mymaster 172.21.0.2 6379 2' > /tmp/sentinel.conf;
      echo 'sentinel down-after-milliseconds mymaster 5000' >> /tmp/sentinel.conf;
      echo 'sentinel failover-timeout mymaster 10000' >> /tmp/sentinel.conf;
      echo 'sentinel parallel-syncs mymaster 1' >> /tmp/sentinel.conf;
      redis-server /tmp/sentinel.conf --sentinel
      "
    ports:
      - "26381:26379"
    depends_on:
      - redis-primary
      - redis-replica
    networks:
      redis-network:
        ipv4_address: 172.21.0.6

networks:
  redis-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/16